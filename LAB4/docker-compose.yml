version: '3.8'

services:
  leader:
    build:
      context: .
      dockerfile: leader/Dockerfile
    container_name: leader
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Allow overriding WRITE_QUORUM from the environment when recreating the leader
      WRITE_QUORUM: "${WRITE_QUORUM:-3}"
      MIN_DELAY: "${MIN_DELAY:-0}"
      MAX_DELAY: "${MAX_DELAY:-1000}"
      FOLLOWER_1_URL: "http://follower1:5001"
      FOLLOWER_2_URL: "http://follower2:5002"
      FOLLOWER_3_URL: "http://follower3:5003"
      FOLLOWER_4_URL: "http://follower4:5004"
      FOLLOWER_5_URL: "http://follower5:5005"
    networks:
      - replication-network
    depends_on:
      - follower1
      - follower2
      - follower3
      - follower4
      - follower5

  follower1:
    build:
      context: .
      dockerfile: follower/Dockerfile
    container_name: follower1
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FOLLOWER_ID=follower1
    networks:
      - replication-network

  follower2:
    build:
      context: .
      dockerfile: follower/Dockerfile
    container_name: follower2
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - FOLLOWER_ID=follower2
    networks:
      - replication-network

  follower3:
    build:
      context: .
      dockerfile: follower/Dockerfile
    container_name: follower3
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - FOLLOWER_ID=follower3
    networks:
      - replication-network

  follower4:
    build:
      context: .
      dockerfile: follower/Dockerfile
    container_name: follower4
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - FOLLOWER_ID=follower4
    networks:
      - replication-network

  follower5:
    build:
      context: .
      dockerfile: follower/Dockerfile
    container_name: follower5
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - FOLLOWER_ID=follower5
    networks:
      - replication-network

networks:
  replication-network:
    driver: bridge